<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Trang chủ UTEShop</title>
</head>
<body>
    <!-- Đoạn nội dung này sẽ được nhúng tự động vào layout:fragment="content" của file layout.html -->
    <div layout:fragment="content">
        <h1 style="color: #2563eb;">Trang chủ UTEShop</h1>
        
        <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-top: 20px;">
            <h3 sec:authorize="isAuthenticated()">
                Xin chào <span style="color: #2563eb;" th:text="${#authentication.principal.fullName}">User</span>! Bạn đã đăng nhập thành công.
            </h3>
            
            <h3 sec:authorize="isAnonymous()">
                Bạn hiện đang là Khách. Vui lòng đăng nhập để xem thông tin cá nhân.
            </h3>
        </div>
    </div>
</body>
</html>
