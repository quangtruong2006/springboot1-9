<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0;}
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        .login-box h2 { text-align: center; margin-top: 0; color: #2563eb; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .btn-submit { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; }
        .error { background: #fee2e2; color: #dc2626; border: 1px solid #f87171; }
        .success { background: #dcfce7; color: #16a34a; border: 1px solid #4ade80; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Đăng nhập</h2>
        <div th:if="${param.error}" class="alert error">
            Username/Email hoặc Password không đúng!
        </div>
        <div th:if="${param.logout}" class="alert success">
            Bạn đã đăng xuất thành công.
        </div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username hoặc Email</label>
                <input type="text" name="login" placeholder="Nhập username hoặc email..." required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn-submit">Đăng Nhập</button>
        </form>
    </div>
</body>
</html>
